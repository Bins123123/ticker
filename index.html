<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G.S. Wilcox Rate Ticker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      overflow: hidden;
    }

    .rt2-ticker {
      display: flex;
      align-items: stretch;
      width: 100%;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font: 400 14px/1.2 "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      --bg: #faf9f8;
      --text: #201f1e;
      --muted: #605e5c;
      --accent: #0078d4;
      --pin: #0078d4;
      --pin-text: #fff;
      --down: #a4262c;
      --sep: #c8c6c4;
      border-radius: 2px;
      box-shadow: 0 0 0 1px #edebe9;
    }

    .rt2-ticker * { box-sizing: border-box; }

    /* Left Pin */
    .rt2-pin {
      flex: none;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: var(--pin);
      color: var(--pin-text);
      position: relative;
      z-index: 2;
      white-space: nowrap;
    }
    .rt2-pin-title { font-weight: 600; font-size: 13px; }
    .rt2-pin-sub { font-size: 11px; opacity: 0.9; }

    /* Track Window */
    .rt2-window {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent);
      mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 24px), transparent);
    }
    .rt2-track {
      display: flex;
      width: max-content;
      animation: rt2-scroll 40s linear infinite;
      will-change: transform;
    }
    .rt2-ticker:hover .rt2-track,
    .rt2-ticker:focus-within .rt2-track {
      animation-play-state: paused;
    }

    /* Content Groups */
    .rt2-set { display: flex; align-items: center; flex: none; }
    .rt2-group {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 0;
      white-space: nowrap;
    }
    .rt2-label, .rt2-rate {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      gap: 6px;
    }
    .rt2-tag { display: none; }
    .rt2-name { font-size: 13px; font-weight: 600; }
    .rt2-term { font-size: 12px; color: var(--accent); font-weight: 600; }
    .rt2-val {
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .rt2-down .rt2-term { color: var(--muted); font-weight: 400; }
    .rt2-down .rt2-val { color: var(--down); }
    .rt2-sep {
      width: 1px;
      height: 16px;
      background: var(--sep);
      margin: 0 22px;
      flex: none;
    }

    /* Right Pinned Section */
    .rt2-pin-right {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      background: var(--bg);
      border-left: 1px solid var(--sep);
      position: relative;
      z-index: 2;
      white-space: nowrap;
    }

    /* Animations & Queries */
    @keyframes rt2-scroll { to { transform: translateX(-50%); } }
    @media (max-width: 600px) {
      .rt2-pin { padding: 8px 12px; }
      .rt2-pin-sub { display: none; }
      .rt2-val { font-size: 13px; }
      .rt2-group { gap: 10px; }
      .rt2-sep { margin: 0 12px; }
    }
  </style>
</head>
<body>

<div class="rt2-ticker" role="region" aria-label="Current rates from G.S. Wilcox &amp; Co">
  <div class="rt2-pin">
    <span class="rt2-pin-title">Current rates</span>
    <span class="rt2-pin-sub">from G.S. Wilcox &amp; Co</span>
  </div>
  
  <div class="rt2-window">
    <div class="rt2-track">
      <!-- Set 1 -->
      <div class="rt2-set">
        <div class="rt2-group">
          <span class="rt2-label"><span class="rt2-name">Life insurance company</span></span>
          <span class="rt2-rate"><span class="rt2-term">5 yr</span><span class="rt2-val">5.92–6.52%</span></span>
          <span class="rt2-rate"><span class="rt2-term">10 yr</span><span class="rt2-val">6.11–6.71%</span></span>
        </div>
        <span class="rt2-sep"></span>
        <div class="rt2-group">
          <span class="rt2-label"><span class="rt2-name">Bank</span></span>
          <span class="rt2-rate"><span class="rt2-term">5 yr</span><span class="rt2-val">6.43–6.93%</span></span>
          <span class="rt2-rate"><span class="rt2-term">10 yr</span><span class="rt2-val">6.52–7.02%</span></span>
        </div>
        <span class="rt2-sep"></span>
      </div>

      <!-- Set 2: Duplicate for seamless infinite loop -->
      <div class="rt2-set" aria-hidden="true">
        <div class="rt2-group">
          <span class="rt2-label"><span class="rt2-name">Life insurance company</span></span>
          <span class="rt2-rate"><span class="rt2-term">5 yr</span><span class="rt2-val">5.92–6.52%</span></span>
          <span class="rt2-rate"><span class="rt2-term">10 yr</span><span class="rt2-val">6.11–6.71%</span></span>
        </div>
        <span class="rt2-sep"></span>
        <div class="rt2-group">
          <span class="rt2-label"><span class="rt2-name">Bank</span></span>
          <span class="rt2-rate"><span class="rt2-term">5 yr</span><span class="rt2-val">6.43–6.93%</span></span>
          <span class="rt2-rate"><span class="rt2-term">10 yr</span><span class="rt2-val">6.52–7.02%</span></span>
        </div>
        <span class="rt2-sep"></span>
      </div>
    </div>
  </div>

  <!-- Right Pinned Item (10-Yr Treasury) -->
  <div class="rt2-pin-right">
    <span class="rt2-name">10-Yr Treasury</span>
    <span class="rt2-rate rt2-down">
      <span class="rt2-term">Change</span>
      <span class="rt2-val"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M6 11 .8 4.5h10.4z" fill="currentColor"/></svg> −9 bps</span>
    </span>
  </div>
</div>

</body>
</html>
